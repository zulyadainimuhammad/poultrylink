services:
  db:
    image: postgres:16-alpine
    container_name: poultrylink-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poultrylink}
      POSTGRES_USER: ${POSTGRES_USER:-poultrylink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poultrylink} -d ${POSTGRES_DB:-poultrylink}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
